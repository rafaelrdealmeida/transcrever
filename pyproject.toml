[project]
name = "transcrever"
version = "0.1.0"
description = "CLI para transcrição automatizada de áudio/vídeo com identificação de falantes"
license = { text = "MIT" }
authors = [{ name = "Rafael de Almeida" }]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "typer[all]>=0.15.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "soundfile>=0.13.1",
    "simple-diarizer>=0.0.13",
]

[project.optional-dependencies]
diarize = ["pyannote.audio>=3.1", "torch>=2.0"]
vastai = ["vastai"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
transcrever = "transcrever.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcrever"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
